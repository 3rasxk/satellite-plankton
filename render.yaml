services:
  - type: web
    name: plankton-backend
    env: python
    pythonVersion: "3.11.7"
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn src.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: EE_PROJECT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SCHEDULER_INTERVAL_MINUTES
        value: "360"
      - key: VALIDATION_CACHE_TTL_HOURS
        value: "24"
