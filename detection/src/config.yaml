# detection/src/config.yaml
#
# Every threshold and rule the detection/prediction engine uses, in one
# human-readable place (CLAUDE.md §5, .claude/agents/bloom-detection.md
# "Non-negotiable rules": "Every threshold and rule lives in config.yaml").
# src/prediction.py reads this file; nothing tunable is hard-coded there.
#
# ---------------------------------------------------------------------
# ANOMALY STATUS — scoring disabled, 2026-09-05.
# Sentinel-2 indices cannot be standardized against MODIS chlor_a:
# their units differ. No valid index baseline exists yet.
# Numeric cutoffs below are inactive historical convention placeholders.
# calibrated_* remains null pending a valid statistic.
# ---------------------------------------------------------------------

indices:
  primary: ndci            # docs/DETECTION_PLAN.md §2: NDCI is the primary chlorophyll proxy
  compare: [ndci, 2bda, 3bda]
  secondary_discrimination: b2_b3_ratio  # exploratory context only; not a validated species classifier

climatology:
  window_days: 7            # +/- days around target day-of-year pooled across all MODIS archive years
  min_reliable_n: 5         # below this many pooled observations, climatology.py flags reliable=false

# Inactive historical cutoff shape retained for future calibration.
# No entry supplies a valid baseline, and none is currently applied to
# Sentinel-2 index values. calibrated_* must remain null.
thresholds:
  ndci:
    elevated_z: 1.5
    warning_z: 2.0
    literature_default_elevated_z: 1.5
    literature_default_warning_z: 2.0
    calibrated_elevated_z: null   # no valid statistic or calibration
    calibrated_warning_z: null
  2bda:
    elevated_z: 1.5
    warning_z: 2.0
    literature_default_elevated_z: 1.5
    literature_default_warning_z: 2.0
    calibrated_elevated_z: null
    calibrated_warning_z: null
  3bda:
    elevated_z: 1.5
    warning_z: 2.0
    literature_default_elevated_z: 1.5
    literature_default_warning_z: 2.0
    calibrated_elevated_z: null
    calibrated_warning_z: null
    note: >
      Historical convention placeholders only; no valid index anomaly
      statistic or empirical calibration exists yet.

# ---------------------------------------------------------------------
# Prediction layer -- rule-based risk escalation (docs/DETECTION_PLAN.md
# §3). Every rule below is readable as a sentence; src/prediction.py
# evaluates each rule's condition list and reports which fired in
# `triggered_rules`, never a single opaque score.
# ---------------------------------------------------------------------
escalation_rules:
  elevated:
    description: "Inactive: requires a valid spatial anomaly statistic, which is not computed."
    conditions:
      - "spatial_anomaly_z >= 1.5"
  watch:
    description: "Inactive: requires a valid spatial anomaly statistic and a rising 14-day trend."
    conditions:
      - "spatial_anomaly_z >= 1.5"
      - "trend_14d_rising == true"
  warning:
    description: "Inactive: requires a valid spatial anomaly statistic, a rising 14-day trend and SST above its seasonal normal."
    conditions:
      - "spatial_anomaly_z >= 2.0"
      - "trend_14d_rising == true"
      - "sst_anomaly > 0"

# Trend/acceleration computation parameters (src/prediction.py).
trend:
  short_window_days: 7
  long_window_days: 14
  # A window is considered "rising" if its linear slope (chlor_a per day)
  # is positive -- least-squares slope over whatever real MODIS
  # observations fall in the window (which may be fewer than the window
  # width in days, given real archive gaps; see climatology.py).
  rising_slope_min: 0.0

# Prediction confidence statement -- read literally by prediction.py's
# docstring and never overridden per-call. No lead-time accuracy figure is
# computed or reported anywhere in this codebase.
prediction_confidence_label: "indicative, rule-based -- not a validated forecast"

# Public risk/API output stays disabled even if an older cache row contains a
# legacy level. Enabling this requires validated anomaly and risk calibration.
risk_evaluation:
  active: false
  status: "inactive_no_calibrated_thresholds"

# Provisional statistical signal levels. These are defined for a future
# scientifically compatible Sentinel-2 history and are not connected to
# production output yet: this repository does not persist a baseline with the
# required location, season, acquisition-date, and preprocessing identity.
# They are not bloom thresholds and do not populate risk_level.
#
# The five numbers below are FIXED by the documented robust-z method; their
# single definition is the constants in detection/src/signal_anomaly.py
# (MIN_INDEPENDENT_DATES, MAX_OBSERVATION_AGE_DAYS, MAD_SCALE, WATCH_AT_Z,
# HIGH_AT_Z). They are listed here so every rule is readable in config, not so
# they can be tuned: signal_anomaly._config() (used by assess_signal_anomaly
# and classify_robust_z) and detection/tests/test_signal_anomaly.py reject
# mad_scale/watch_at_z/high_at_z that differ, a minimum_independent_dates below
# 30, or a max_observation_age_days outside 0..14. Raising the date
# count or lowering the age here only tightens; the backend activation gate
# (backend/src/scientific_status.py) reads the same constants through
# backend/src/_detection.py, so it can never open on a looser value.
signal_anomaly:
  status: "inactive_no_consistent_sentinel2_baseline"
  minimum_independent_dates: 30
  max_observation_age_days: 14
  mad_scale: 1.4826
  watch_at_z: 2.0
  high_at_z: 3.0
