<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05192d"/>
      <stop offset="50%" stop-color="#0a2a4a"/>
      <stop offset="100%" stop-color="#021424"/>
    </linearGradient>

    <!-- Bio-luminescent Glow -->
    <linearGradient id="bloomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="60%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>

    <!-- Radar Sweep Glow -->
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Base: Rounded App Tile -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="rgba(0, 245, 160, 0.25)" stroke-width="1.5"/>

  <!-- Satellite Watch Radar Rings -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="rgba(0, 210, 255, 0.18)" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="rgba(0, 245, 160, 0.28)" stroke-width="1.2"/>

  <!-- Glowing Phytoplankton Algae / Diatom Symbol -->
  <g filter="url(#glow)">
    <!-- Dynamic Bloom Petals / Flagella -->
    <path d="M32 14 C36 22 42 28 50 32 C42 36 36 42 32 50 C28 42 22 36 14 32 C22 28 28 22 32 14 Z"
          fill="url(#bloomGrad)" opacity="0.92"/>

    <!-- Central Chlorophyll Nucleus -->
    <circle cx="32" cy="32" r="6.5" fill="#ffffff" opacity="0.95"/>
    <circle cx="32" cy="32" r="4" fill="#00f5a0"/>
  </g>

  <!-- Satellite Pulse Nodes -->
  <circle cx="32" cy="14" r="2" fill="#00f5a0"/>
  <circle cx="50" cy="32" r="2" fill="#00d2ff"/>
  <circle cx="32" cy="50" r="2" fill="#0066ff"/>
  <circle cx="14" cy="32" r="2" fill="#00f5a0"/>
</svg>